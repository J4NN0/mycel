services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: ["tools"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8081:8081"

  app:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PROVIDER=${PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - REDIS_ADDR=redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-info}

volumes:
  redis_data:
