site_name: Mycel
site_description: A personal AI assistant that runs on your own machine.
repo_url: https://github.com/J4NN0/mycel
repo_name: J4NN0/mycel
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Setup:
      - Automatic installation: setup/automatic.md
      - Manual installation: setup/manual.md
      - Configuration: configuration.md
  - Commands:
      - Overview: commands/index.md
      - Commands: commands/commands.md
  - Platforms:
      - Overview: platforms/index.md
      - Telegram: platforms/telegram.md
  - Tools:
      - Overview: tools/index.md
      - Web search: tools/web_search.md
      - Fetch URL: tools/fetch_url.md
      - List files: tools/list_files.md
      - Grep files: tools/grep_files.md
      - Read file: tools/read_file.md
      - Email: tools/email.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
